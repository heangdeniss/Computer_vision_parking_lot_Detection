# Fine-tuning hyperparameters for parking-space (parking-space.v1i.yolov11/data.yaml).
# Flat Ultralytics train args; passed via `yolo.train(cfg=...)`.
# Conservative augmentation: parking spaces are geometric, so keep flips but avoid
# perspective/shear/rotation that would distort stall geometry.

# --- optimization ---
optimizer: AdamW
lr0: 0.001 # initial learning rate
lrf: 0.01 # final LR = lr0 * lrf (cosine schedule)
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 7.5 # box loss gain
cls: 0.5 # classification loss gain
dfl: 1.5 # distribution focal loss gain

# --- schedule / runtime ---
epochs: 100
batch: 8
imgsz: 640
device: 0
workers: 4
patience: 20
close_mosaic: 10
val: true
save: true
plots: true
exist_ok: false

# --- augmentation ---
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
erasing: 0.4
