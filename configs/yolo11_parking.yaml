# YOLOv11 detection architecture for parking-space occupancy.
# Classes: 0 = empty, 1 = occupied (matches parking-space.v1i.yolov11/data.yaml).
#
# Full official YOLO11 detection graph, annotated by stage so every layer is inspectable.
# Backbone  : Conv downsampling -> C3k2 -> SPPF -> C2PSA, with P3/8, P4/16, P5/32 outputs
# Neck      : PAN-FPN (top-down upsample + bottom-down stride convolutions, Concat + C3k2)
# Head      : anchor-free decoupled Detect at P3/P4/P5 (box IoU + DFL, 2-class scores)
#
# Scale is fixed to "s" so the graph matches yolo11s.pt exactly.
# To use yolo11m.pt instead, change the single scale line to:  m: [0.50, 1.00, 512]
# and pass --weights yolo11m.pt to src/train.py.

nc: 2 # number of classes: empty, occupied
scales:
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024] # ~181 layers, 9.46M params, 21.7 GFLOPs (with 80 classes; fewer with nc=2)

# ----------------------------- BACKBONE ---------------------------------
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2    stem
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2        C3k2 feature block
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8    low-level feature map -> neck
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16   mid-level feature map -> neck
  - [-1, 2, C3k2, [512, True]] # 6        C3k2 with k=3 (True)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32   deep feature map -> neck
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9        spatial pyramid pooling (multi receptive fields)
  - [-1, 2, C2PSA, [1024]] # 10       C2f + partial spatial attention (YOLO11 novelty)

# ------------------------------- NECK ------------------------------------
head:
  # PAN-FPN top-down path (P5 -> P4 -> P3)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12       cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15       cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16     P3/8 output

  # PAN-FPN bottom-up path (P3 -> P4 -> P5)
  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18      cat head P4
  - [-1, 2, C3k2, [512, False]] # 19     P4/16 output
  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21      cat backbone P5 (after C2PSA)
  - [-1, 2, C3k2, [1024, True]] # 22     P5/32 output

  # ------------------------------- HEAD ----------------------------------
  - [[16, 19, 22], 1, Detect, [nc]] # 23  Detect(P3/8, P4/16, P5/32): box (IoU+DFL) + class scores
